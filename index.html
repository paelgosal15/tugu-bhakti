<header><div class="wrap"><a class="brand" href="#top" id="brand">Tugu Bhakti</a><nav id="nav" aria-label="Menu utama"></nav></div></header>

 <svg class="tugu" viewBox="0 0 120 300" role="img" aria-label="Tugu dengan salib di tengahnya"><path fill="currentColor" fill-rule="evenodd" d="M60 6 L84 60 L92 250 L28 250 L36 60 Z M56 90 h8 v22 h22 v8 h-22 v58 h-8 v-58 h-22 v-8 h22 Z"/><rect x="14" y="250" width="92" height="14" fill="currentColor"/><rect x="4" y="264" width="112" height="16" fill="currentColor"/></svg>

 <div class="chat-b" id="msgs" aria-live="polite"></div>

 <form class="chat-f" id="chat-form"><input id="q" maxlength="800" placeholder="Tulis pertanyaan…" autocomplete="off" aria-label="Pertanyaan"><button class="btn" type="submit">Kirim</button></form>
